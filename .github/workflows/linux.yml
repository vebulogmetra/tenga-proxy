name: Linux

on:
  push:
    branches: [develop, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Публикация deb-пакета в релиз по тегу.
permissions:
  contents: write

env:
  # install_dev.sh отвечает на свои вопросы по умолчанию.
  CI: "true"
  # PyGObject и pycairo собираются из исходников, GTK и libadwaita берутся из
  # системы: ubuntu-24.04 даёт libadwaita 1.5, как у разработчика.
  APT_PACKAGES: >-
    libgirepository-2.0-dev libcairo2-dev pkg-config
    gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus dbus-x11

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - uses: astral-sh/setup-uv@v5

      - name: Python dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run python cli.py lint-all

      - name: Tests
        run: uv run pytest -q -p no:cacheprovider --no-cov

      # Виджеты GTK4 под xvfb на своей шине сессии (см. Makefile).
      - name: GTK tests
        run: make test-gtk

      # Трей поднимает собственную шину через Gio.TestDBus.
      - name: Tray tests
        run: make test-tray

      # Qt-интерфейс Windows: платформа offscreen, без дисплея. Библиотеки —
      # то, что грузят платформенный плагин и QtGui из PySide6.
      - name: Qt tests
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3
          make test-qt

      # deb-пакет работает на системном Python: requests и urllib3 — версий
      # Ubuntu 24.04, а не из uv.lock.
      - name: Tests on Ubuntu's requests
        run: uv run --with requests==2.31.0 --with urllib3==2.0.7 pytest -q -p no:cacheprovider --no-cov

  deb:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # install_dev.sh ставит и Python-зависимости: PyGObject собирается из исходников.
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - uses: astral-sh/setup-uv@v5

      - name: xray-core
        run: bash core/scripts/install_dev.sh

      - name: Build deb
        run: bash core/scripts/build_deb.sh

      # Пакет ставится как у пользователя: зависимости из apt, postinst выдаёт
      # xray cap_net_admin, правило sudoers проходит visudo.
      - name: Install deb
        run: |
          sudo apt-get install -y ./dist/*.deb
          getcap /usr/lib/tenga-proxy/core/bin/xray | grep -q cap_net_admin
          sudo visudo -cf /etc/sudoers.d/tenga-proxy
          tenga-proxy --version
          cd / && python3 -c "import sys; sys.path.insert(0, '/usr/lib/tenga-proxy'); import src.ui.application"

      - uses: actions/upload-artifact@v4
        with:
          name: tenga-proxy-linux-deb
          path: dist/*.deb
          if-no-files-found: error

      # Тег создаёт владелец при выпуске версии; v0.18.0 обязан собрать 0.18.0.
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "v$VERSION" = "${{ github.ref_name }}" ] || { echo "Тег ${{ github.ref_name }} не совпадает с версией $VERSION"; exit 1; }

      - name: Attach deb to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          # Windows-сборка могла создать черновик одновременно с этой.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "$tag" --notes "" || gh release view "$tag" >/dev/null
          gh release upload "$tag" dist/*.deb --clobber
