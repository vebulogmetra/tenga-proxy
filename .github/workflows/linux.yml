name: Linux

on:
  push:
    branches: [develop, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Публикация AppImage в релиз по тегу.
permissions:
  contents: write

env:
  # install_dev.sh отвечает на свои вопросы по умолчанию.
  CI: "true"
  # PyGObject и pycairo собираются из исходников, GTK и libadwaita берутся из
  # системы: ubuntu-24.04 даёт libadwaita 1.5, как у разработчика.
  APT_PACKAGES: >-
    libgirepository-2.0-dev libcairo2-dev pkg-config
    gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus dbus-x11

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - uses: astral-sh/setup-uv@v5

      - name: Python dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run python cli.py lint-all

      - name: Tests
        run: uv run pytest -q -p no:cacheprovider --no-cov

      # Виджеты GTK4 под xvfb на своей шине сессии (см. Makefile).
      - name: GTK tests
        run: make test-gtk

      # Трей поднимает собственную шину через Gio.TestDBus.
      - name: Tray tests
        run: make test-tray

  appimage:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: xray-core
        run: bash core/scripts/install_dev.sh

      # appimagetool сам является AppImage, а FUSE на раннере нет.
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash core/scripts/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tenga-proxy-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

      # Тег создаёт владелец при выпуске версии; v0.18.0 обязан собрать 0.18.0.
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "v$VERSION" = "${{ github.ref_name }}" ] || { echo "Тег ${{ github.ref_name }} не совпадает с версией $VERSION"; exit 1; }

      - name: Attach AppImage to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          # Windows-сборка могла создать черновик одновременно с этой.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "$tag" --notes "" || gh release view "$tag" >/dev/null
          gh release upload "$tag" dist/*.AppImage --clobber
